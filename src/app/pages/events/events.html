<div class="page-wrap">
  <div class="row g-4">
    <!-- LEFT: Competitions list -->
    <div class="col-lg-8">
      <div class="panel">
        <div class="panel-title blue"><i class="fa fa-list-ul"></i> Competitions</div>
        <div id="compList" class="d-flex row gap-3">
          @for (event of events(); track $index) {
            <div class="comp-item col-5">
              <h5>{{ event.title }}</h5>
              <div class="desc">{{ event.description }}</div>
              <div class="meta">
                <i class="fa fa-calendar"></i> {{ event.startDate | date: 'dd MMM' }} -
                {{ event.endDate | date: 'dd MMM' }}
              </div>
              <div class="meta">
                <i class="fa fa-info-circle"></i> Status:
                <span class="status-badge status-upcoming">{{ event.status }}</span>
              </div>
              <div class="comp-actions d-flex justify-content-between">
                <button class="btn btn-edit" data-id="b705be66-bdc6-4130-9bd2-63276efb7a2e">
                  <i class="fa fa-pencil me-1"></i> Edit
                </button>
                <button
                  routerLink="/submissions/{{ event.competitionId }}"
                  class="btn btn-edit"
                  data-id="b705be66-bdc6-4130-9bd2-63276efb7a2e"
                >
                  <i class="fa fa-inbox me-1"></i> See Submissions
                </button>
                <button class="btn btn-delete" data-id="b705be66-bdc6-4130-9bd2-63276efb7a2e">
                  <i class="fa fa-trash me-1"></i> Delete
                </button>
              </div>
            </div>
          }
        </div>
      </div>
    </div>

    <!-- RIGHT: Add / Edit form -->
    <div class="col-lg-4">
      <div class="panel">
        <div class="panel-title green">
          <i class="fa fa-plus-circle"></i> <span id="formTitle">Add / Edit Competition</span>
        </div>

        <form id="compForm" novalidate>
          <input type="hidden" id="compId" />

          <label class="form-label">Title</label>
          <input
            type="text"
            [(ngModel)]="competitionObj.title"
            name="title"
            class="form-control"
            id="title"
            placeholder="e.g. CodeFest 2026"
            required
          />

          <label class="form-label">Description</label>
          <textarea
            class="form-control"
            [(ngModel)]="competitionObj.description"
            name="description"
            id="description"
            placeholder="What's this competition about?"
            required
          ></textarea>

          <label class="form-label">Start Date</label>
          <input
            type="date"
            [(ngModel)]="competitionObj.startDate"
            name="startDate"
            class="form-control"
            id="startDate"
            required
          />

          <label class="form-label">End Date</label>
          <input
            type="date"
            [(ngModel)]="competitionObj.endDate"
            name="endDate"
            class="form-control"
            id="endDate"
            required
          />

          <select
            [(ngModel)]="competitionObj.status"
            name="status"
            class="form-select"
            id="status"
            required
          >
            <option value="" disabled selected>Select Status</option>
            <option value="upcoming">Upcoming</option>
            <option value="ongoing">Ongoing</option>
            <option value="completed">Completed</option>
          </select>

          <button type="button" (click)="onSave()" class="btn btn-save" id="saveBtn">
            Save Competition
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
