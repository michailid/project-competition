<div class="page-wrap">
  <div class="table-card">
    <div class="table-header"><i class="fa fa-list-ul"></i> Project Submissions</div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th class="text-start">Project Title</th>
            <th>Submitted By</th>
            <th>Email</th>
            <th>GitHub Link</th>
            <th>Status</th>
            <th>Rank</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="submissionsBody">
          @for (item of submissionList; track $index) {
            <tr>
              <td>{{ $index }}</td>
              <td>{{ item.projectTitle }}</td>
              <td>{{ item.fullName }}</td>
              <td>{{ item.email }}</td>
              <td>
                <a [href]="item.githubLink" target="_blank" class="btn btn-sm btn-outline-primary">
                  <i class="fa fa-github"></i> Repo</a
                >
              </td>
              <td>
                <span class="badge bg-info text-dark">{{ item.status }}</span>
              </td>
              <td>
                <span class="badge bg-success">{{ item.rank }}</span>
              </td>
              <td>
                <button class="btn btn-sm btn-warning m-1">
                  <i class="fa fa-pencil"></i>
                </button>
                <button class="btn btn-sm btn-danger">
                  <i class="fa fa-trash"></i>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Submission</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editForm">
          <input type="hidden" id="editId" />

          <label class="form-label">Status</label>
          <input
            type="text"
            class="form-control mb-3"
            id="editStatus"
            placeholder="e.g. Shortlisted"
          />

          <label class="form-label">Rank</label>
          <input type="number" class="form-control mb-3" id="editRank" min="0" step="1" />
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-modal-save" id="saveEditBtn">Save changes</button>
      </div>
    </div>
  </div>
</div>
