<!-- Register Form -->
<div [class]="isLoginFormVisible() ? 'hidden' : ''" class="auth-card">
  <div class="auth-title"><i class="fa fa-user-plus"></i> Register</div>

  <form id="registerForm" novalidate>
    <input
      type="text"
      [(ngModel)]="registerObj.fullName"
      name="fullName"
      class="form-control"
      id="fullName"
      placeholder="Full Name"
      required
    />
    <input
      type="email"
      [(ngModel)]="registerObj.email"
      name="email"
      class="form-control"
      id="email"
      placeholder="Email"
      required
    />
    <input
      type="password"
      [(ngModel)]="registerObj.password"
      name="password"
      class="form-control"
      id="password"
      placeholder="Password"
      required
      minlength="6"
    />
    <input
      type="text"
      [(ngModel)]="registerObj.collegeName"
      name="collegeName"
      class="form-control"
      id="collegeName"
      placeholder="College Name"
      required
    />

    <select [(ngModel)]="registerObj.role" name="role" class="form-select" id="role" required>
      <option value="" disabled selected>Select Role</option>
      <option value="participant">Participant</option>
      <option value="organizer">Organizer</option>
    </select>

    <button type="button" class="btn btn-register" (click)="onRegister()">Register</button>
  </form>

  <div class="auth-footer">Already have an account? <a (click)="toggleForm()">Login</a></div>
</div>

<!-- Login Form -->
<div [class]="isLoginFormVisible() ? '' : 'hidden'" class="auth-card">
  <div class="auth-title"><i class="fa fa-sign-in"></i> Login</div>

  <form id="loginForm" novalidate>
    <input type="email" class="form-control" id="email" placeholder="Email" required />
    <input
      type="password"
      class="form-control"
      id="password"
      placeholder="Password"
      required
      minlength="6"
    />

    <button type="submit" class="btn btn-login">Login</button>
  </form>

  <div class="auth-footer">New user? <a (click)="toggleForm()">Register here</a></div>
</div>
